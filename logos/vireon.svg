<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagonal molecule mark -->
  <g transform="translate(0, 4)">
    <!-- Outer hexagon -->
    <path d="M20 2 L34 10 L34 30 L20 38 L6 30 L6 10 Z" stroke="url(#g1)" stroke-width="2" fill="none"/>
    <!-- Inner V shape (representing Vireon, also looks molecular) -->
    <path d="M13 14 L20 26 L27 14" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Atom dots -->
    <circle cx="20" cy="2" r="2" fill="#00d4aa"/>
    <circle cx="20" cy="38" r="2" fill="#00d4aa"/>
    <circle cx="13" cy="14" r="1.5" fill="#0a1929"/>
    <circle cx="27" cy="14" r="1.5" fill="#0a1929"/>
  </g>

  <!-- Wordmark "VIREON" -->
  <text x="46" y="32" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0a1929" letter-spacing="2">VIREON</text>

  <!-- Gradient for hex outline -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
  </defs>
</svg>
